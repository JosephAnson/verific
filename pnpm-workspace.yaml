ignoreScripts: true

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - zod@4.5.4

shamefullyHoist: true

shellEmulator: true

sideEffectsCache: false

strictPeerDependencies: false

trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1

packages:
  - packages/*
  - playgrounds/*

overrides:
  # Patch the esbuild development-server advisory in upstream build tooling.
  esbuild@>=0.27.3 <0.28.1: 0.28.2
  typescript: 5.9.3
  # VitePress 1 still requests Vite 5; Vite 6.4.3 contains its security fixes.
  vitepress>vite: 6.4.3

peerDependencyRules:
  allowedVersions:
    vue-sfc-transformer: 0.2.5

update:
  ignoreDeps:
    # Match the Node 24 runtime used locally and in CI.
    - '@types/node'
    # Vue and Nuxt tooling do not yet support the TypeScript 7 compiler API.
    - typescript
    # Vue I18n 11.4 imports GenericComponentInstance, absent from stable Vue 3.5.
    # Keep its matching devtools declarations on the tested 11.1.12 line too.
    - '@intlify/devtools-types'
    - vue-i18n

allowBuilds:
  esbuild: true
  vue-demi: true
