name: Docker

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    if: ${{ github.ref == 'refs/heads/main' }}
    concurrency:
      group: deploy-main-v2
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Verify successful CI for selected commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ci_run_count="$(gh api \
            --method GET \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&head_sha=${GITHUB_SHA}&per_page=1" \
            --jq '.workflow_runs | length')"

          if [[ "$ci_run_count" -eq 0 ]]; then
            echo "::error::No successful push-triggered CI run found for ${GITHUB_SHA}"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_DEPLOY_USERNAME_V2 }}
          password: ${{ secrets.DOCKERHUB_DEPLOY_TOKEN_V2 }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_DEPLOY_USERNAME_V2 }}/verific:${{ github.sha }}
          sbom: true

      - name: Promote current main digest to latest
        env:
          DIGEST: ${{ steps.docker_build.outputs.digest }}
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ secrets.DOCKERHUB_DEPLOY_USERNAME_V2 }}/verific
        run: |
          set -euo pipefail

          current_sha="$(gh api \
            --method GET \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            --jq '.object.sha')"

          if [[ "$current_sha" != "$EXPECTED_SHA" ]]; then
            echo "::notice::Skipping latest promotion because ${EXPECTED_SHA} is no longer the main tip"
            exit 0
          fi

          if [[ -z "$DIGEST" ]]; then
            echo "::error::Docker build did not return a digest"
            exit 1
          fi

          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            "${IMAGE}@${DIGEST}"
